{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Jamilah</title>
    <link rel="icon" type="image/png" href="{% static 'assets/img/favicon.png' %}">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1f36;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%232d3250' fill-opacity='0.4'%3E%3Cpath d='M0 0h1v1H0zM10 10h1v1h-1zM20 20h1v1h-1zM30 30h1v1h-1zM40 40h1v1h-1zM50 50h1v1h-1zM60 60h1v1h-1zM70 70h1v1h-1zM80 80h1v1h-1zM90 90h1v1h-1z'/%3E%3C/g%3E%3C/svg%3E");
        }

        .login-container {
            background: #1c1c1c;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 340px;
        }

        .title {
            color: white;
            font-size: 20px;
            text-align: center;
            margin: 0 0 24px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .alert {
            background-color: #ff4d4d;
            color: white;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 4px;
            font-size: 13.5px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-label {
            display: block;
            color: #9ba4b4;
            font-size: 13px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 11px 12px;
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: #0099ff;
        }

        .input-field.is-invalid {
            border-color: #ff4d4d !important;
            background-color: #332222;
        }

        .input-field.is-valid {
            border-color: #00cc66 !important;
        }

        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .toggle-btn:hover {
            color: #0099ff;
        }

        .field-error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: #0099ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        .login-button:hover {
            background: #0088ee;
        }

        .login-button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div style="text-align: center; margin-bottom: 1.25rem;">
            <a href="{% url 'home' %}" style="display: inline-block; text-decoration: none;">
                <img src="{% static 'assets/img/jamilah_logo_white.png' %}?v=2" alt="Jamilah" style="height: 44px; width: auto; object-fit: contain;">
            </a>
        </div>
        <h1 class="title">Admin Login</h1>
        {% if messages %}
        <div class="alert">
            {% for message in messages %}
            <p style="margin: 0;">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        <form method="post" id="adminLoginForm" novalidate>
            {% csrf_token %}
            <div class="input-group">
                <label for="username" class="input-label">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" class="input-field" required value="{{ form_data.username|default:'' }}" autocomplete="username">
                </div>
                <div id="username-error" class="field-error"></div>
            </div>
            
            <div class="input-group">
                <label for="password" class="input-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="input-field" style="padding-right: 38px;" required autocomplete="current-password">
                    <button type="button" class="toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-8.3 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                        </svg>
                    </button>
                </div>
                <div id="password-error" class="field-error"></div>
            </div>
            
            <button type="submit" class="login-button" id="adminSubmitBtn">Login</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('adminLoginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('username-error');
            const passwordError = document.getElementById('password-error');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const eyeIcon = document.getElementById('eyeIcon');

            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                if (type === 'text') {
                    eyeIcon.innerHTML = `<path d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z"/><path d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z"/>`;
                } else {
                    eyeIcon.innerHTML = `<path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-8.3 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>`;
                }
            });

            function validateUsername() {
                const val = usernameInput.value.trim();
                if (!val) {
                    usernameInput.classList.add('is-invalid');
                    usernameInput.classList.remove('is-valid');
                    usernameError.textContent = 'Username is required.';
                    usernameError.style.display = 'block';
                    return false;
                } else {
                    usernameInput.classList.remove('is-invalid');
                    usernameInput.classList.add('is-valid');
                    usernameError.style.display = 'none';
                    return true;
                }
            }

            function validatePassword() {
                const val = passwordInput.value;
                if (!val) {
                    passwordInput.classList.add('is-invalid');
                    passwordInput.classList.remove('is-valid');
                    passwordError.textContent = 'Password is required.';
                    passwordError.style.display = 'block';
                    return false;
                } else {
                    passwordInput.classList.remove('is-invalid');
                    passwordInput.classList.add('is-valid');
                    passwordError.style.display = 'none';
                    return true;
                }
            }

            usernameInput.addEventListener('input', function() {
                if (usernameInput.classList.contains('is-invalid') || usernameInput.classList.contains('is-valid')) {
                    validateUsername();
                }
            });
            usernameInput.addEventListener('blur', validateUsername);

            passwordInput.addEventListener('input', function() {
                if (passwordInput.classList.contains('is-invalid') || passwordInput.classList.contains('is-valid')) {
                    validatePassword();
                }
            });
            passwordInput.addEventListener('blur', validatePassword);

            form.addEventListener('submit', function(e) {
                const isUserValid = validateUsername();
                const isPassValid = validatePassword();
                if (!isUserValid || !isPassValid) {
                    e.preventDefault();
                    if (!isUserValid) usernameInput.focus();
                    else passwordInput.focus();
                }
            });
        });
    </script>
</body>
</html>
